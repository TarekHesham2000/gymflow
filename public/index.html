<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymFlow</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top" style="--c:#111827"><div class="wrap"><div><h1>GymFlow</h1><small>اعرف الجيم زحمة ولا لا قبل ما تنزل</small></div></div></header>
<main class="wrap pull">
  <section class="card"><h2>الجيمات</h2><div id="list" class="muted">جاري التحميل...</div></section>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('/api/gyms').then((r) => r.json()).then((gs) => {
  document.getElementById('list').innerHTML = gs.length ? gs.map((g) =>
    `<a class="item" href="/g/${encodeURIComponent(g.slug)}" style="text-decoration:none;color:inherit"><b>${esc(g.name)}</b><span class="pill" style="background:${esc(g.color)};color:#fff">فتح</span></a>`).join('') : 'لا يوجد جيمات';
});
</script>
</body>
</html>
